name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - stage
      - x-main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # turbo typechecks the workspace packages first; apps/web reads their emitted declarations.
      - run: yarn turbo run typecheck --filter=@uniswap/interface

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: apps/web/node_modules/.cache/eslint
          key: ${{ runner.os }}-eslint-${{ github.sha }}
          restore-keys: ${{ runner.os }}-eslint-
      - run: yarn workspace @uniswap/interface lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Suites listed in apps/web/jest.known-failures.cjs are skipped.
      - run: yarn workspace @uniswap/interface test --ci --maxWorkers=100%
